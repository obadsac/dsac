<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBA - Post Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Chart.js for Poll Results -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        html, body { max-width: 100vw; overflow-x: hidden; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        .glass-panel { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .hover-lift { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .hover-lift:hover { transform: translateY(-3px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        #page-loader { position: fixed; inset: 0; background: #ffffff; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body class="text-slate-800 antialiased w-full">

    <!-- Loading Screen -->
    <div id="page-loader">
        <div class="relative w-16 h-16">
            <div class="absolute inset-0 rounded-full border-4 border-slate-100"></div>
            <div class="absolute inset-0 rounded-full border-4 border-cyan-600 border-t-transparent animate-spin"></div>
        </div>
        <p class="text-slate-500 font-bold text-xs uppercase tracking-widest mt-4">Fetching Real Data...</p>
    </div>

    <div class="flex h-screen overflow-hidden opacity-0 transition-opacity duration-700 w-full" id="main-content">
        <div class="flex-1 flex flex-col h-screen overflow-hidden relative">
            
            <!-- Mobile Optimized Header -->
            <header class="h-16 md:h-20 glass-panel sticky top-0 flex items-center justify-between px-4 lg:px-10 z-20 shrink-0 gap-2">
                <div class="flex items-center min-w-0 flex-1">
                    <button onclick="window.location.href='event-management.html'" class="mr-3 md:mr-4 text-slate-500 hover:text-slate-800 transition flex items-center justify-center font-bold text-xs md:text-sm bg-slate-100 w-8 h-8 md:w-auto md:h-auto md:px-4 md:py-2 rounded-xl shrink-0">
                        <i class="fas fa-arrow-left md:mr-2"></i> <span class="hidden md:inline">Back</span>
                    </button>
                    <div class="truncate pr-2">
                        <h2 class="text-base sm:text-lg md:text-2xl font-extrabold text-slate-800 tracking-tight truncate" id="headerTitle">Analytics Report</h2>
                        <p class="text-[9px] md:text-[10px] text-slate-500 font-bold uppercase tracking-widest truncate" id="headerSubtitle">Detailed Insights</p>
                    </div>
                </div>
                
                <!-- Action Buttons (Export/Print) -->
                <div class="flex gap-2 md:gap-3 shrink-0">
                    <button onclick="window.print()" class="bg-white border border-slate-200 text-slate-600 px-3 py-1.5 md:px-4 md:py-2 rounded-lg md:rounded-xl text-[11px] md:text-sm font-bold shadow-sm hover:bg-slate-50 hover:text-cyan-600 transition flex items-center h-8 md:h-auto">
                        <i class="fas fa-print md:mr-2"></i> <span class="hidden md:inline">Print</span>
                    </button>
                    <button class="bg-cyan-600 text-white px-3 py-1.5 md:px-4 md:py-2 rounded-lg md:rounded-xl text-[11px] md:text-sm font-bold shadow-sm hover:bg-cyan-700 transition flex items-center h-8 md:h-auto">
                        <i class="fas fa-file-csv md:mr-2"></i> <span class="hidden sm:inline">Export</span><span class="sm:hidden ml-1">CSV</span>
                    </button>
                </div>
            </header>

            <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 md:p-6 lg:p-8 relative w-full">
                <div class="max-w-5xl mx-auto pb-10 w-full">
                    
                    <!-- Post Summary Card -->
                    <div class="bg-white rounded-2xl md:rounded-3xl shadow-sm border border-slate-200 p-5 md:p-6 mb-6 md:mb-8 flex flex-col md:flex-row justify-between items-start md:items-center relative overflow-hidden w-full">
                        <div class="absolute -right-10 -top-10 w-32 h-32 md:w-40 md:h-40 bg-cyan-500/5 rounded-full blur-3xl pointer-events-none"></div>
                        <div class="relative z-10 w-full md:w-auto pr-0 md:pr-4 flex-1 min-w-0">
                            <span id="postTypeBadge" class="bg-slate-100 text-slate-600 text-[9px] md:text-[10px] px-2.5 md:px-3 py-1 rounded-full font-bold uppercase tracking-wider mb-2 md:mb-3 inline-block">Loading...</span>
                            <h1 id="postTitle" class="text-xl sm:text-2xl md:text-3xl font-extrabold text-slate-800 mb-1.5 md:mb-2 leading-snug break-words">Fetching Details...</h1>
                            <p id="postDate" class="text-[11px] md:text-sm text-slate-500 font-medium"><i class="far fa-calendar-alt mr-1 md:mr-1.5"></i> - </p>
                        </div>
                        
                        <div class="mt-5 md:mt-0 flex gap-4 relative z-10 w-full md:w-auto shrink-0">
                            <div class="bg-cyan-50 border border-cyan-100 p-3 md:p-4 rounded-xl text-center flex-1 md:flex-none md:min-w-[140px]">
                                <p class="text-[9px] md:text-[10px] font-bold text-cyan-600 uppercase tracking-widest mb-1">Total Engagements</p>
                                <h3 id="totalCount" class="text-2xl md:text-3xl font-extrabold text-cyan-700">-</h3>
                            </div>
                        </div>
                    </div>

                    <!-- Dynamic Results Area -->
                    <div id="dynamicContentArea" class="grid grid-cols-1 gap-6 md:gap-8 w-full">
                        <!-- Chart or Table will be injected here via JS -->
                    </div>

                </div>
            </main>
        </div>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://nraqhwfobchmvjnbkhfd.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5yYXFod2ZvYmNobXZqbmJraGZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMTMyMDgsImV4cCI6MjEwMDg4OTIwOH0.Q_UUnJPg_fvPePFGFc6RWwmf1fFs0J9lYUOlF-WQmfE';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');

            if (!postId) {
                alert("Invalid URL. Post ID is missing.");
                window.location.href = 'event-management.html';
                return;
            }

            try {
                // 1. Fetch the main Event/Post Details
                const { data: post, error: postError } = await supabaseClient.from('events').select('*').eq('id', postId).single();
                if (postError) throw postError;

                // 2. Fetch corresponding analytics data based on the Type
                let analyticsData = [];
                let totalEngagements = 0;

                if (post.type === 'Poll') {
                    // Fetch Votes
                    const { data } = await supabaseClient.from('event_responses').select('*').eq('event_id', postId);
                    analyticsData = data || [];
                    totalEngagements = analyticsData.length;
                } else if (post.type === 'Award') {
                    // Fetch Nominations (Attempting to fetch profile full_name if linked, otherwise uses nominee_name)
                    const { data } = await supabaseClient.from('award_nominations').select(`*, profiles (full_name)`).eq('event_id', postId);
                    analyticsData = data || [];
                    totalEngagements = analyticsData.length;
                } else {
                    // Fetch RSVPs (Tickets) with User profile details
                    const { data } = await supabaseClient.from('event_rsvps').select(`*, profiles (full_name)`).eq('event_id', postId);
                    analyticsData = data || [];
                    totalEngagements = analyticsData.length;
                }

                // Update UI Summary Header
                document.getElementById('postTitle').innerText = post.title;
                document.getElementById('postDate').innerHTML = `<i class="far fa-calendar-alt mr-1 md:mr-1.5"></i> ${new Date(post.created_at).toLocaleString()}`;
                document.getElementById('totalCount').innerText = totalEngagements;
                
                const typeColors = { 'Event': 'text-emerald-600 bg-emerald-50 border-emerald-200', 'Poll': 'text-purple-600 bg-purple-50 border-purple-200', 'Award': 'text-amber-600 bg-amber-50 border-amber-200' };
                document.getElementById('postTypeBadge').className = `${typeColors[post.type] || 'text-slate-600 bg-slate-100'} border text-[9px] md:text-[10px] px-2.5 md:px-3 py-1 rounded-full font-bold uppercase tracking-wider mb-2 md:mb-3 inline-block shadow-sm`;
                document.getElementById('postTypeBadge').innerText = post.type;

                // 3. Render content dynamically with real data
                renderDynamicContent(post, analyticsData);

            } catch (err) {
                console.error(err);
                document.getElementById('postTitle').innerText = "Error Loading Data";
            } finally {
                document.getElementById('page-loader').style.display = 'none';
                document.getElementById('main-content').classList.remove('opacity-0');
            }
        });

        function renderDynamicContent(post, analyticsData) {
            const contentArea = document.getElementById('dynamicContentArea');
            
            if (post.type === 'Poll') {
                // --- POLL VIEW (PIE CHART) ---
                document.getElementById('headerSubtitle').innerText = "Live Voting Results";
                
                const pollOptions = post.poll_options ? (typeof post.poll_options === 'string' ? JSON.parse(post.poll_options) : post.poll_options) : [];
                
                // Calculate REAL votes for each option
                const results = pollOptions.map(opt => {
                    return analyticsData.filter(response => response.response_text === opt).length;
                });

                contentArea.innerHTML = `
                    <div class="bg-white rounded-2xl md:rounded-3xl shadow-sm border border-slate-200 p-4 sm:p-6 md:p-8 flex justify-center items-center w-full">
                        <div class="w-full max-w-sm md:max-w-xl relative pb-4 h-[300px] sm:h-[350px] md:h-[400px] flex justify-center">
                            ${analyticsData.length === 0 ? '<p class="text-slate-500 font-medium text-sm flex items-center h-full">No votes submitted yet.</p>' : '<canvas id="pollChart" class="w-full h-full"></canvas>'}
                        </div>
                    </div>
                `;

                if (analyticsData.length > 0) {
                    const ctx = document.getElementById('pollChart').getContext('2d');
                    new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: pollOptions,
                            datasets: [{
                                data: results,
                                backgroundColor: ['#6366f1', '#14b8a6', '#f59e0b', '#ec4899', '#8b5cf6'],
                                borderWidth: 0,
                                hoverOffset: 10
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { position: 'bottom', labels: { padding: 15, font: { family: 'Inter', weight: 'bold', size: window.innerWidth < 768 ? 11 : 13 } } }
                            },
                            cutout: '60%'
                        }
                    });
                }

            } else {
                // --- EVENT / AWARD VIEW (TABLE) ---
                const isAward = post.type === 'Award';
                document.getElementById('headerSubtitle').innerText = isAward ? "Nomination List" : "Registration List";

                // Generate Table Rows using Real Data
                let tableRowsHTML = '';
                
                if (analyticsData.length === 0) {
                    tableRowsHTML = `
                        <tr class="block md:table-row bg-white border-b border-slate-100">
                            <td colspan="4" class="block md:table-cell py-8 px-4 text-center text-slate-500 text-sm font-medium">No records found for this post yet.</td>
                        </tr>
                    `;
                } else {
                    analyticsData.forEach(item => {
                        // Extract Real Details
                        let memberName = isAward ? item.nominee_name : (item.profiles?.full_name || 'Verified Member');
                        let initials = memberName ? memberName.substring(0, 2).toUpperCase() : 'MM';
                        let actionDate = new Date(item.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });
                        
                        let reasonOrStatusHTML = isAward 
                            ? `<span class="text-slate-600 italic text-[11px] md:text-xs leading-tight block">"${item.reason || 'No reason provided'}"</span>` 
                            : `<span class="bg-emerald-50 text-emerald-600 border border-emerald-200 px-2 py-0.5 md:py-1 rounded text-[9px] md:text-[10px] font-bold uppercase tracking-wider shadow-sm">${item.status || 'Confirmed'}</span>`;

                        tableRowsHTML += `
                            <tr class="block md:table-row bg-white border border-slate-200 md:border-b md:border-slate-50 md:border-t-0 md:border-l-0 md:border-r-0 rounded-2xl md:rounded-none mb-3 md:mb-0 shadow-sm md:shadow-none hover:bg-slate-50 transition overflow-hidden w-full">
                                <td class="block md:table-cell py-3.5 md:py-4 px-4 font-bold text-slate-800 border-b border-slate-100 md:border-0 bg-slate-50/50 md:bg-transparent">
                                    <div class="flex items-center">
                                        <div class="h-8 w-8 rounded-full bg-slate-800 text-white flex items-center justify-center text-xs mr-3 shrink-0 shadow-sm">${initials}</div>
                                        <span class="truncate break-words whitespace-normal">${memberName}</span>
                                    </div>
                                </td>
                                <td class="flex justify-between items-center md:table-cell py-2.5 md:py-4 px-4 text-slate-600 font-medium text-xs md:text-sm border-b border-slate-100 md:border-0">
                                    <span class="md:hidden text-[10px] text-slate-400 uppercase tracking-widest font-bold">Batch</span>
                                    -
                                </td>
                                <td class="flex justify-between items-center md:table-cell py-2.5 md:py-4 px-4 border-b border-slate-100 md:border-0">
                                    <span class="md:hidden text-[10px] text-slate-400 uppercase tracking-widest font-bold mr-3 shrink-0">${isAward ? 'Reason' : 'Status'}</span>
                                    <div class="text-right md:text-left flex-1 break-words whitespace-normal max-w-[200px] md:max-w-none ml-auto md:ml-0">
                                        ${reasonOrStatusHTML}
                                    </div>
                                </td>
                                <td class="flex justify-between items-center md:table-cell py-2.5 md:py-4 px-4 md:text-right text-slate-500 text-[11px] md:text-xs bg-slate-50/30 md:bg-transparent">
                                    <span class="md:hidden text-[10px] text-slate-400 uppercase tracking-widest font-bold">Date</span>
                                    ${actionDate}
                                </td>
                            </tr>
                        `;
                    });
                }

                contentArea.innerHTML = `
                    <div class="bg-transparent md:bg-white md:rounded-3xl md:shadow-sm md:border border-slate-200 overflow-hidden w-full">
                        <div class="p-4 md:p-5 border-b border-slate-200 md:border-slate-100 flex flex-col sm:flex-row justify-between sm:items-center bg-white md:bg-slate-50/50 rounded-2xl md:rounded-none shadow-sm md:shadow-none mb-4 md:mb-0 gap-3 sm:gap-0 w-full">
                            <h3 class="text-sm md:text-base font-bold text-slate-800 flex items-center shrink-0">
                                <div class="w-7 h-7 md:w-8 md:h-8 rounded-lg bg-cyan-100 text-cyan-600 flex items-center justify-center mr-2 md:mr-3"><i class="fas fa-users text-xs md:text-base"></i></div>
                                ${isAward ? 'Nominees' : 'Registered Members'}
                            </h3>
                            <div class="relative w-full sm:w-auto">
                                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                                <input type="text" placeholder="Search name..." class="w-full sm:w-auto pl-8 pr-3 py-2 md:py-1.5 bg-slate-50 md:bg-white border border-slate-200 rounded-lg text-xs md:text-sm focus:bg-white focus:ring-2 focus:ring-cyan-500 outline-none transition">
                            </div>
                        </div>
                        <div class="md:overflow-x-auto md:p-2 bg-slate-50 md:bg-transparent w-full">
                            <table class="w-full text-left border-collapse block md:table">
                                <thead class="hidden md:table-header-group">
                                    <tr class="text-slate-400 text-[10px] uppercase tracking-widest border-b border-slate-100">
                                        <th class="pb-3 px-4 font-semibold">Member Name</th>
                                        <th class="pb-3 px-4 font-semibold">Batch</th>
                                        <th class="pb-3 px-4 font-semibold">${isAward ? 'Nomination Reason' : 'Payment Status'}</th>
                                        <th class="pb-3 px-4 font-semibold text-right">Date</th>
                                    </tr>
                                </thead>
                                <tbody class="block md:table-row-group text-sm w-full">
                                    ${tableRowsHTML}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
