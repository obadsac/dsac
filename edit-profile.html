    <!-- Supabase Integration -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Mobile Sidebar Toggle Logic
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        const supabaseUrl = 'https://nraqhwfobchmvjnbkhfd.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5yYXFod2ZvYmNobXZqbmJraGZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMTMyMDgsImV4cCI6MjEwMDg4OTIwOH0.Q_UUnJPg_fvPePFGFc6RWwmf1fFs0J9lYUOlF-WQmfE';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let currentUserId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // 1. Auth Check
                const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
                if (sessionError || !session) { window.location.href = 'index.html'; return; }

                currentUserId = session.user.id;
                document.getElementById('inpEmail').value = session.user.email; // Populate immutable email

                // 2. Fetch Existing Profile Data
                const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', currentUserId).single();

                if(profile) {
                    // Fallback to metadata if DB is empty
                    const metadata = session.user.user_metadata || {};
                    const fullName = profile.full_name || metadata.full_name || '';

                    // Fill Inputs
                    document.getElementById('inpName').value = fullName;
                    document.getElementById('inpNic').value = profile.nic || '';
                    document.getElementById('inpDob').value = profile.dob || '';
                    if(profile.blood_group) document.getElementById('inpBlood').value = profile.blood_group;
                    document.getElementById('inpMobile').value = profile.mobile || '';
                    
                    // Detailed Address Inputs
                    document.getElementById('inpRoad').value = profile.address_road || '';
                    document.getElementById('inpArea').value = profile.address_area || '';
                    if(profile.address_district) document.getElementById('inpDistrict').value = profile.address_district;
                    if(profile.address_province) document.getElementById('inpProvince').value = profile.address_province;

                    document.getElementById('inpJob').value = profile.current_job || '';
                    document.getElementById('inpEdu').value = profile.highest_edu || '';

                    // Set Avatar
                    const defaultAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(fullName)}&background=334155&color=fff&size=256`;
                    document.getElementById('formAvatar').src = profile.avatar_url || defaultAvatar;
                }

                // 3. Reveal UI
                document.getElementById('page-loader').style.display = 'none';
                document.getElementById('main-content').classList.remove('opacity-0');

            } catch (err) {
                console.error("Editor Load Error:", err);
                Swal.fire('Error', 'Could not load profile data.', 'error');
            }
        });

        // 4. Handle Form Submission
        async function handleProfileUpdate(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSave');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Saving...';
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            try {
                // Collect Data
                const updateData = {
                    full_name: document.getElementById('inpName').value,
                    nic: document.getElementById('inpNic').value.toUpperCase(),
                    dob: document.getElementById('inpDob').value,
                    blood_group: document.getElementById('inpBlood').value,
                    mobile: document.getElementById('inpMobile').value,
                    
                    address_road: document.getElementById('inpRoad').value,
                    address_area: document.getElementById('inpArea').value,
                    address_district: document.getElementById('inpDistrict').value,
                    address_province: document.getElementById('inpProvince').value,
                    
                    current_job: document.getElementById('inpJob').value,
                    highest_edu: document.getElementById('inpEdu').value,
                    updated_at: new Date().toISOString()
                };

                // Update Database
                const { error } = await supabaseClient.from('profiles').update(updateData).eq('id', currentUserId);

                if (error) throw error;

                // Success
                Swal.fire({
                    title: 'Profile Saved!',
                    text: 'Your information has been successfully updated.',
                    icon: 'success',
                    confirmButtonColor: '#059669',
                    customClass: { popup: 'rounded-2xl md:rounded-3xl' }
                }).then(() => {
                    window.location.href = 'my-profile.html';
                });

            } catch (err) {
                Swal.fire('Update Failed', err.message, 'error');
                btn.innerHTML = '<i class="fas fa-save mr-2"></i> Save Profile';
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
